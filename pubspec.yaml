name: reciclapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Otras
  image_picker: ^1.1.2

  # Firebase (todas alineadas con firebase_core 4.x)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.4

  # Animaciones / Estado
  lottie: ^3.1.0
  provider: ^6.1.2

   # IA de Firebase (Gemini / Vertex AI)
  firebase_ai: ^3.6.0
  tflite_flutter: ^0.12.1
  camera: ^0.11.3
  image: ^4.1.3
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/reciclaje.json
    - assets/planeta.png
    - assets/fondo_eco.png
    - assets/login.json
    - assets/register.json
    - assets/mundito_icon.png
    - assets/mundito_icon_v2.png
    - assets/model.tflite
    - assets/labels.txt

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/planeta.png"

  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/planeta.png"

  min_sdk_android: 21
