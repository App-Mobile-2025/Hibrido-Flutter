name: reciclapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (versiones compatibles entre sí)
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.3.4

  lottie: ^3.1.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/reciclaje.json
    - assets/planeta.png  

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/planeta.png"

  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/planeta.png"
  min_sdk_android: 21
